<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>
  <rect width="252" height="252" x="2" y="2" rx="46" fill="none" stroke="url(#bridgeGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle circuit grid lines -->
  <path d="M 40 128 H 216" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  <path d="M 128 40 V 216" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Left node (WordPress / CMS) -->
  <circle cx="70" cy="128" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <path d="M 60 120 L 70 142 L 80 120" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="114" r="3" fill="#38bdf8"/>

  <!-- Right node (AI / Neural / Brain) -->
  <circle cx="186" cy="128" r="28" fill="#1e293b" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>
  <!-- AI sparkle icon inside right node -->
  <path d="M 186 114 Q 186 128 196 128 Q 186 128 186 142 Q 186 128 176 128 Q 186 128 186 114 Z" fill="url(#sparkGrad)"/>

  <!-- The Bridge / Connection Arc -->
  <path d="M 98 128 C 120 90, 136 90, 158 128" fill="none" stroke="url(#bridgeGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 98 128 C 120 166, 136 166, 158 128" fill="none" stroke="url(#bridgeGrad)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.8"/>

  <!-- Center Core / Pulse -->
  <circle cx="128" cy="128" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="14" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
</svg>
